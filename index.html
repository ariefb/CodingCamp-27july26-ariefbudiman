<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <span class="site-title">Life Dashboard</span>
    <button
      id="btn-theme-toggle"
      class="btn-icon"
      aria-label="Toggle dark/light mode"
      title="Toggle dark/light mode"
    >🌙</button>
  </header>

  <!-- Main Dashboard Grid -->
  <main class="dashboard">
    <div class="dashboard__grid">

      <!-- 1. Greeting Widget -->
      <section id="greeting-widget" class="widget" aria-label="Greeting">
        <h2 class="widget__title">Hello!</h2>
        <div class="greeting-name-row">
          <label for="greeting-name-input" class="sr-only">Your name</label>
          <input
            id="greeting-name-input"
            type="text"
            class="greeting-name-input"
            placeholder="Enter your name…"
            maxlength="50"
            autocomplete="off"
          />
        </div>
        <p id="greeting-message" class="greeting-message">Good Morning</p>
        <p id="greeting-name-display" class="greeting-name-display"></p>
        <p id="greeting-time" class="greeting-time">00:00</p>
        <p id="greeting-date" class="greeting-date">Loading…</p>
      </section>

      <!-- 2. Focus Timer Widget -->
      <section id="focus-timer" class="widget" aria-label="Focus Timer">
        <h2 class="widget__title">Focus Timer</h2>
        <div id="timer-display" class="timer-display" aria-live="polite" aria-atomic="true">25:00</div>
        <div class="timer-controls">
          <button id="btn-start" class="btn btn--primary">Start</button>
          <button id="btn-stop"  class="btn btn--secondary">Stop</button>
          <button id="btn-reset" class="btn btn--ghost">Reset</button>
        </div>
      </section>

      <!-- 3. To-Do List Widget -->
      <section id="todo-widget" class="widget" aria-label="To-Do List">
        <h2 class="widget__title">To-Do List</h2>
        <form id="todo-form" class="input-row" novalidate>
          <label for="todo-input" class="sr-only">New task description</label>
          <input
            id="todo-input"
            type="text"
            class="text-input"
            placeholder="Add a task…"
            maxlength="200"
            autocomplete="off"
          />
          <button type="submit" class="btn btn--primary">Add</button>
        </form>
        <ul id="todo-list" class="todo-list" aria-label="Task list"></ul>
      </section>

      <!-- 4. Quick Links Widget -->
      <section id="quick-links-widget" class="widget" aria-label="Quick Links">
        <h2 class="widget__title">Quick Links</h2>
        <form id="quick-links-form" class="quick-links-form" novalidate>
          <div class="input-row">
            <label for="link-label-input" class="sr-only">Link label</label>
            <input
              id="link-label-input"
              type="text"
              class="text-input"
              placeholder="Label"
              maxlength="60"
              autocomplete="off"
            />
            <label for="link-url-input" class="sr-only">Link URL</label>
            <input
              id="link-url-input"
              type="url"
              class="text-input"
              placeholder="https://…"
              maxlength="500"
              autocomplete="off"
            />
          </div>
          <button type="submit" class="btn btn--primary btn--full">Add Link</button>
        </form>
        <div id="quick-links-list" class="quick-links-list" aria-label="Quick link buttons"></div>
      </section>

    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
